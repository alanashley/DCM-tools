# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    # The code is built for Java 8 (the JDK the wrapper scripts use on IBM i), and must also work on newer Java levels
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '17' ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Collect build output
      if: matrix.java == '8'
      run: |
        mkdir -p dist
        cp target/*-with-dependencies.jar dist/dcmtools.jar
        tar -czf dist/dcmtools-scripts.tar.gz scripts
    - name: Upload build
      if: matrix.java == '8'
      uses: actions/upload-artifact@v4
      with:
        name: dcmtools-${{ github.sha }}
        path: dist/
        retention-days: 30
